port: 7880
bind_addresses:
  - ""
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: false
  # For local docker testing, getting the IP might be tricky. 
  # Often simpler to just use 127.0.0.1 for local dev if not accessed from other machines.
  # external_ip: 127.0.0.1 

keys:
  # This section will be overridden by the LIVEKIT_KEYS env var in docker-compose, 
  # or you can set defaults here.
  devkey: secret

logging:
  json: false
  level: info
